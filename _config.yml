# Aurora Cybersecurity — site settings
# Restart `bundle exec jekyll serve` after editing this file.

title: Aurora Cybersecurity
tagline: Cybersecurity consulting
description: "Boutique cybersecurity consulting: threat modeling, cloud, application and DevOps security."
url: "https://auroracyber.ca"
baseurl: ""

# Contact details used across the site
email: hello@auroracyber.ca
github_org: Aurora-Cybersecurity
booking_url: "https://calendly.com/auroracybersecurity-pm/30min"

# Social sharing defaults (used by jekyll-seo-tag)
logo: /assets/images/icon-512.png
image:
  path: /assets/images/og-image.png
  width: 1200
  height: 630
  alt: Aurora Cybersecurity wordmark over a northern-lights night sky
twitter:
  card: summary_large_image
social:
  name: Aurora Cybersecurity
  links:
    - https://github.com/Aurora-Cybersecurity

plugins:
  - jekyll-seo-tag

# Keep build tooling and docs out of the published site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - brand
